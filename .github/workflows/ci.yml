name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      USE_MOCKS: "1"
      SESSION_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      DEMO_PIN: "1234"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The team does not want Claude (or any AI) listed as a contributor or co-author.
      - name: No AI attribution in commits or the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='co-authored-by:.*(claude|anthropic)|noreply@anthropic\.com|generated with .*claude'
          if [ -n "$BASE_SHA" ]; then msgs=$(git log --format=%B "$BASE_SHA..$HEAD_SHA"); else msgs=$(git log -1 --format=%B); fi
          if printf '%s\n%s\n' "$msgs" "$PR_BODY" | grep -iE "$pattern"; then
            echo "::error::Remove the AI co-author / 'Generated with Claude Code' lines (commit messages or PR description)."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Turned on in Phase 6 (remove `if: false`) once tests/e2e exists.
  e2e:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    env:
      USE_MOCKS: "1"
      SESSION_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      DEMO_PIN: "1234"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
