# Skill 1 — 2-digit subtraction with bundles and sticks (owner: P3; P1's engine loads and checks it).
# STARTER: English is ready. Hindi is a first draft — P3 must have a native Hindi speaker check every line
# (and the education mentor check the mistakes) before Wed 28. Bump `version` on every change.
#
# Rules for this file:
# - Every number a child says comes from the engine (src/lib/engine/bugs.ts), never from this file or Claude.
#   Backup lines use {answer}, which the engine fills in.
# - All sums: two 2-digit numbers, first bigger, and the ones digit of the first is smaller (needs borrowing).
# - Both languages must be complete, or the engine refuses to start.

id: sub_2digit
version: 5
title:
  en: "2-digit subtraction with bundles and sticks"
  hi: "बंडल और तीलियों से दो अंकों का घटाव"
grade: 2
languages: [en, hi]

# The first sum starts the lesson. The rest are for evals and suggestions.
sums: ["52-27", "43-18", "61-24", "70-35", "84-59", "92-46"]

# Up to 50 words that speech-to-text must hear right (sent to Saaras as keyterms).
keyterms:
  [Ravi, Arjun, Meena, Sana, bundle, bundles, sticks, borrow, tens, ones, minus, "take away",
   रवि, अर्जुन, मीना, सना, बंडल, तीली, तीलियाँ, दहाई, इकाई, उधार, घटाओ, माइनस]

children:
  - id: ravi
    name: { en: Ravi, hi: रवि }
    gender: boy
    bug: smallerFromLarger
    start: { state: STUCK, engagement: 3 }
    persona: "Quick and loud. Always answers first. Proud of his answers, a bit of a show-off, but friendly."
    explainsAs: "In each column I take the small number from the big number."
    sampleLines:
      en: ["35, Teacher! I did it first!", "Easy! 8 minus 3 is 5.", "Me first, Teacher! Me first!", "I know! I know!", "That's so easy, Teacher."]
      hi: ["35, टीचर जी! मैंने सबसे पहले कर लिया!", "आसान है! 8 में से 3 गए तो 5।", "पहले मैं, टीचर जी! पहले मैं!", "मुझे पता है! मुझे पता है!", "ये तो बहुत आसान है, टीचर जी।"]

  # Operator's decision (1 Nov): one child carries the mistake; the rest of the class gets it right.
  # Arjun and Meena are correct (bug: null, like Sana) — their old mistakes stay in bugs.ts for tests and evals.
  - id: arjun
    name: { en: Arjun, hi: अर्जुन }
    gender: boy
    bug: null
    start: { state: GOT_IT, engagement: 2 }
    persona: "Confident and quick with bundles and sticks. Likes to show how he opened a bundle to borrow."
    explainsAs: "When the ones are too few, I open one bundle, so the tens have one less."
    sampleLines:
      en: ["25, Teacher! I opened a bundle.", "I borrowed one ten, Teacher.", "Easy, Teacher!", "I can show it with sticks!", "Done, Teacher!"]
      hi: ["25, टीचर जी! मैंने एक बंडल खोला।", "मैंने एक दहाई उधार ली, टीचर जी।", "आसान है, टीचर जी!", "मैं तीलियों से दिखा सकता हूँ!", "हो गया, टीचर जी!"]

  - id: meena
    name: { en: Meena, hi: मीना }
    gender: girl
    bug: null
    start: { state: GOT_IT, engagement: 2 }
    persona: "Careful and slow. Counts back on her fingers one at a time and gets it right. Speaks softly."
    explainsAs: "I count back on my fingers, one number at a time, carefully."
    sampleLines:
      en: ["Wait… I'm counting on my fingers… 25.", "51, 50, 49… I got 25, Teacher.", "One minute, Teacher… I'm still counting.", "Let me count again slowly.", "I think I counted right."]
      hi: ["रुकिए… उंगलियों पर गिन रही हूँ… 25।", "51, 50, 49… मेरा 25 आया, टीचर जी।", "एक मिनट, टीचर जी… मैं अभी गिन रही हूँ।", "रुकिए, मैं धीरे-धीरे फिर से गिन लूँ।", "मुझे लगता है मैंने सही गिना।"]

  - id: sana
    name: { en: Sana, hi: सना }
    gender: girl
    bug: null
    start: { state: GOT_IT, engagement: 0 }   # silent until the teacher invites her by name
    persona: "Very shy. Knows the answer but speaks only when invited by name. Short, quiet answers."
    explainsAs: "I open one bundle, so I have enough sticks."
    sampleLines:
      en: ["Umm… 25, Teacher?", "I opened one bundle…", "Me, Teacher?", "Umm… I think so…", "Thank you, Teacher."]
      hi: ["वो… 25, टीचर जी?", "मैंने एक बंडल खोला…", "मैं, टीचर जी?", "जी… शायद हाँ…", "थैंक यू, टीचर जी।"]

# What each move does in this skill (the engine's rules use these groups).
moves:
  reveal: [ask_to_explain, compare_methods]
  fix: [concrete_materials, targeted_question]
  halfFix: [think_aloud]
  weak: [tell_answer, repeat_same_way, move_on_or_scold]
  engagementUp: [invite_quiet_child, specific_praise]
  engagementDown: [move_on_or_scold]

# Used when a generated line fails the line check, and for hello / "say again".
backupLines:
  en:
    STUCK: "{answer}, Teacher!"
    WOBBLY: "Is it {answer}? I think so…"
    GOT_IT: "{answer}! I opened a bundle."
    react: "Yes, Teacher!"
    repeat: "Teacher, can you say it again?"
    hello: "Good morning, Teacher!"
    puzzled: "Teacher, what is that?"
    cannot: "Teacher, how can we take a big number from a small one?"
    notToday: "Teacher, today we are doing take-away sums!"
  hi:
    STUCK: "{answer}, टीचर जी!"
    WOBBLY: "{answer} है क्या? मुझे लगता है…"
    GOT_IT: "{answer}! मैंने एक बंडल खोला।"
    react: "जी, टीचर जी!"
    repeat: "टीचर जी, फिर से बोलिए ना?"
    hello: "नमस्ते टीचर जी!"
    puzzled: "टीचर जी, ये क्या है?"
    cannot: "टीचर जी, छोटे में से बड़ा कैसे घटाएँ?"
    notToday: "टीचर जी, आज तो हम घटाना सीख रहे हैं ना?"
