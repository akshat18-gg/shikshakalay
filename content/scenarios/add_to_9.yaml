# Module add_to_9 — Class 1, adding up to 9 by counting on (fingers, pebbles, sticks). Ravi counts the first number too (5 + 3 → "5, 6, 7, 8, 9" → 9); the others count on from it.
# Written Sun 1 Nov 2026, generated for the operator's "all modules working" request (private/ops-spec.md). Same engine as sub_2digit: every number a child says comes from src/lib/engine/bugs.ts, never from this file or Claude.
# Hindi reviewed Sun 1 Nov 2026 (native-level pass: classroom register, gender agreement, everyday words).
#
# Rules for this file:
# - Backup lines use {answer}, which the engine fills in. Lines without {answer} must contain no numbers.
# - All sums: two one-digit numbers whose total is at most 9 (counting on with ten fingers).
# - Both languages must be complete, or the engine refuses to start.

id: add_to_9
version: 1
operation: add
title:
  en: "Adding up to 9"
  hi: "9 तक जोड़ना"
grade: 1
languages: [en, hi]

# The first sum starts the lesson. The rest are for evals and suggestions.
sums: ["5+3", "4+2", "6+3", "2+5", "3+4", "7+2"]

# Up to 50 words that speech-to-text must hear right (sent to Saaras as keyterms).
keyterms:
  [Ravi, Arjun, Meena, Sana, plus, add, adding, "count on", fingers, pebbles, sticks, together, "how many",
   रवि, अर्जुन, मीना, सना, जोड़ो, जोड़, प्लस, मिलाकर, गिनो, उंगलियाँ, कंकड़, कौड़ी, तीली]

